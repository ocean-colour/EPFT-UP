# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
#
# Builds the EPFT-UP Sphinx site (rooted at docs/source/) on every push to the
# default branch. Pattern copied from IOPtics (.readthedocs.yaml @ develop),
# with MyST added so the Markdown reports/design docs publish as-is.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"          # EPFT-UP requires Python >= 3.12 (setup.py)

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: false    # advisory, mirroring the CI policy

python:
  install:
    # Install EPFT-UP itself so autodoc can import the package.
    - method: pip
      path: .
    # Documentation build dependencies (Sphinx + theme + MyST).
    - requirements: docs/requirements.txt
